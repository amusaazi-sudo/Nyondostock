<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
      
</head>

<body>
    <form class="container mt-5" style="background-color: aqua; border-radius: 5px;">
  <h1 class="mb-4" style="text-align: center;">Stock Registration Form</h1>
  <div class="mb-3">
    <label for="stockName" class="form-label">Stock Name</label>
    <input type="text" class="form-control" id="stockName" required>
  </div>
  <div class="mb-3">
    <label for="stockSymbol" class="form-label">Stock Symbol</label>
    <input type="text" class="form-control" id="stockSymbol" required>
  </div>
  
  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="quantity" class="form-label">Quantity</label>
      <input type="number" class="form-control" id="quantity" required>
    </div>
    <div class="col-md-6 mb-3">
      <label for="price" class="form-label">Purchase Price</label>
      <input type="number" class="form-control" id="price" required>
    </div>
  </div>
  <div class="mb-3">
    <label for="purchaseDate" class="form-label">Purchase Date</label>
    <input type="date" class="form-control" id="purchaseDate" required>
  </div>
  <div class="mb-3">
    <label for="stockType" class="form-label">Stock Type</label>
    <select class="form-select" id="stockType" required>
      <option value="">Choose...</option>
      <option value="equity">Equity</option>
      <option value="bond">Bond</option>
      <option value="mutual">Mutual Fund</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="broker" class="form-label">Broker Name</label>
    <input type="text" class="form-control" id="broker">
  </div>
  <div class="mb-3">
    <label for="notes" class="form-label">Notes</label>
    <textarea class="form-control" id="notes" rows="3"></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Register Stock</button>
</form>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
