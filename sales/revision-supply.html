<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyondo Stock</title>
    <link rel="stylesheet" href="/styles.css/revision-supply.css">
</head>
 <body>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div>
        <a href="home.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="sales.html">Sales</a>
        <a href="suppliers.html">Suppliers</a>
        <a href="products.html">Products</a>
        <a href="contact.html">Contact Us</a>
      </div>
    </aside>

    <!-- Content -->
    <div class="content">
      <form class="action">
        <section>
          <h1>Business Details</h1>
          <div class="input-container">
            <div class="input-section">
              <label for="business-name">Business name</label>
              <input type="text" placeholder="Enter business name">
            </div>

            <div class="input-section">
              <label for="TIN">TIN</label>
              <input type="text" placeholder="Enter the TIN">
            </div>
          </div>

          <section>
            <h2>Contact Information</h2>
            <div class="input-section">
              <label for="email">Email</label>
              <input type="text" placeholder="---@gmail.com">
            </div>
            <div class="input-section">
              <label for="phone">Phone number</label>
              <input type="text" placeholder="+256xxxxxxxxxxxxx">
            </div>
            <div class="input-section">
              <label for="address">Address</label>
              <input type="text" placeholder="Enter your physical address">
            </div>
          </section>

          <section>
            <h3>Finance Details</h3>
            <div class="input-section">
              <label for="bank-account">Bank account number</label>
              <input type="text" placeholder="Enter bank acc.">
            </div>
            <div class="input-section">
              <label for="file-upload">Upload past performance records:</label>
              <input type="file" id="file-upload" name="file">
            </div>
          </section>
        </section>
      </form>
    </div>
  </div>
</body>
