<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Registration Form</title>
    <link rel="stylesheet" href="/styles.css/suppliersregistration.css">
</head>
<body>
    <div class="container">
<div class="sidebar">
    <div>
    <a href="Dasboard">Dashboard</a>
</div>
<div>
    <a href="sales management">sales management</a>
</div>
<div>
    <a href="transport management">transport management</a>
</div>
    </div>

    <div class="context">
        <form class="details">
            </form>
            <section>
                <h1>Company Information</h1>
                <div class="input-container">
                    <div class="input-section">
                        <label for="Name">Name</label>
                        <input type="text" value="Full Company Legal Name">
                        </div>
                        <br><br>

                        <div class="input-section">
                            <label for="Email">Email</label>
                            <input type="text" value="Enter Company Mailing Address">
                        </div>
                        <br>

                        <div class="input-section">
                            <label for="Year of Company Establishment">Year of Establishment</label>
                            <input type="date">
                        </div>
                        <br><br>
                        <div class="input-section">
                            <label for="Parent Company Details">Parent Company Details</label>
                            <textarea name="Details" id="Details" rows="3" placeholder="Enter your Company Details here..."></textarea>
                        </div>
            </section>

            <section>
                <h2>Contact Details</h2>
                <div class="input-container">
                    <!--div class="input-section"-->
                   

                <!--div class="input-section">
                    <label for="title">Title</label>
                    <input type="type" value="Enter your title">
                </div-->

                <!--div class="input-section">
                    <label for="Phone number">Phone number</label>
                    <input type="tetx" value="Enter your phone number">
                </div-->
                <div class="input-section"> 
                    <label for="telephone numbers">telephone numbers</label>
                    <input type="text" value="Telephone(country code) number">
                </div>
                <div class="input-section">
                    <label for="website">Website</label>
                    <input type="text" value="company website">
                </div>
                <!--div class="input-section">
                    <label for="email">Email</label>
                    <input type="text" value="enter email">
                </div-->
                <div class="input-section">
                    <label for="Address">address</label>
                    <input type="text" value="enter street address">
                </div>
            </section>


                <section>
                    <h3 style="font-size: x-large;">Financial and Banking Information</h3>
                    <div class="input-container">
                        <div class="input-section">
                            <label for="Tax Identification Number">TIN</label>
                            <input type="text">
                        </div>
                        <div class="Value Added Tax Number">VAT Number</div>
                        <input type="text">
                    </div>
                    <div class="input-section">
                        <label for="Bank Name">Bank Name</label>
                        <input type="text" value="enter yur bank name">
                    </div>
                    <div class="input-section">
                        <label for="Account Number">Account Number</label>
                        <input type="text">
                    </div>
                    <div class="input-section">
                        <label for="Account Name">Account Name</label>
                        <input type="text">
                    </div>
                    <div class="input-section">
                        <label for="Branch Name">Branch Name</label>
                        <input type="text">
                    </div>
                    <div class="input-section">
                        <label for="SWIFT code">SWIFT code</label>
                        <input type="text">
                    </div>
                </section>


                <section>
                    <h4 style="font-size: x-large;">Business Capabilities and Profile</h4>
                    <div class="input-container">
                        <!--div class="input-section">
                            <label for="nuber of warehouse">Number of warehouse</label>
                            <input type="text">
                        </div-->
                        <div class="input-section">
                            <label for="Description of goods offered">Description of goods offered</label>
                            <textarea name="Details" id="Details" rows="3" placeholder="describe services offered here..."></textarea>
                        </div>
                        <div class="input-section">
                            <label for="Number of Employees">Number of Employees</label>
                            <input type="text">
                        </div>
                        <div class="input-section">
                            <label for="Details on Manufacturing">Details on Manufacturing</label>
                            <textarea name="Details" id="Details" rows="3" placeholder="describe Manufacturing process"></textarea>
                        </div>
                    </section>
                        
                        
                        <section>
                            <h5 style="font-size: x-large;">Certifications and Diversity</h5>
                            <div class="input-container">
                        <div class="input-section">
                            <label for="Quality Management Certifications">Quality Management Certifications</label>
                            <select name="" id="">
                                <option value="">Select a certificate</option>
                                <option value="1">ISO</option>
                                <option value="2">Lean Six Sigma</option>
                                <option value="3">MBE</option>
                                <option value="4">WBE</option>
                                <option value="5">VBE</option>
                                <option value="6">DOBE</option>
                            </select>
                        </div>
                </section>

                <section>
                    <h6 style="font-size: x-large;">References</h6>
                    <div class="input-container">
                        <div class="input-section">
                            <label for="Customer Testimonials"></label>
                            <textarea name="" id="" rows="3" placeholder="testimony"></textarea>
                        </div>
                        <div class="input-section">
                            <label for="file-upload">Upload past perfomance records:</label>
                            <input type="file" id="file-upload" name="file">
                        </div>
                </section>
                <br><br>

                    <h7 style="font-size: x-large; justify-content: center;">Terms and Conditions</h7>

                </section-->

            </body>
